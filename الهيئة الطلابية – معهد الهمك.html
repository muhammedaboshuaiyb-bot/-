<style>
:root{--bg:#f5f8f4;--surface:#fff;--ink:#2a2e2a;--muted:#5c635c;--navy:#245a2a;--on-navy:#f5f8f4;--accent:#e7804f;--green:#4e9f4b;--line:#d6dfd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e150f;--surface:#172019;--ink:#e8eee8;--muted:#a3b0a4;--navy:#0d2111;--on-navy:#eef3ee;--accent:#ef9262;--green:#6bbd68;--line:#2a372c}}
:root[data-theme="dark"]{--bg:#0e150f;--surface:#172019;--ink:#e8eee8;--muted:#a3b0a4;--navy:#0d2111;--on-navy:#eef3ee;--accent:#ef9262;--green:#6bbd68;--line:#2a372c}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.8;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px}
.brand{font-weight:700;font-size:1.05rem}
nav{display:flex;gap:22px;align-items:center}
nav a{text-decoration:none;font-size:.95rem;opacity:.85}
nav a:hover{opacity:1}
#lang{background:transparent;color:var(--on-navy);border:1px solid var(--accent);border-radius:4px;padding:4px 14px;font:inherit;font-size:.9rem;cursor:pointer}
#lang:hover{background:var(--accent);color:#1f2420}
.hero{background:var(--navy);color:var(--on-navy);padding:72px 0 88px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.3;margin:0 0 18px;font-weight:700}
.hero p{max-width:34em;margin:0 0 30px;opacity:.88}
.btn{display:inline-block;background:var(--accent);color:#1f2420;padding:12px 28px;border-radius:4px;text-decoration:none;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.mark{background:#fff;border-radius:50%;padding:22px;width:100%;max-width:300px;aspect-ratio:1;justify-self:center;display:grid;place-items:center}.mark img{width:100%;height:auto;display:block}
.chip{background:#fff;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex:none}.chip img{width:34px;height:auto;display:block}.brand{display:flex;align-items:center;gap:12px}
section{padding:72px 0}
h2{font-size:1.8rem;margin:0 0 10px;color:var(--ink)}
.lead{color:var(--muted);max-width:38em;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.svc{padding:28px 26px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.svc h3{margin:0 0 8px;font-size:1.1rem;border-inline-start:4px solid var(--green);padding-inline-start:12px}
.svc p{margin:0;color:var(--muted);font-size:.97rem}
.about{background:var(--surface);border-block:1px solid var(--line)}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.about p{margin:0 0 14px;color:var(--muted)}
.facts{list-style:none;margin:0;padding:0}
.facts li{padding:16px 0;border-bottom:1px solid var(--line)}
.facts li:first-child{border-top:1px solid var(--line)}
.facts b{display:block}
.facts span{color:var(--muted);font-size:.95rem}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.contact div{padding:20px 0;border-top:3px solid var(--green)}
.contact b{display:block;margin-bottom:4px}
.contact span{color:var(--muted)}
footer{background:var(--navy);color:var(--on-navy);padding:26px 0;font-size:.9rem;opacity:.95}
@media (max-width:760px){.hero .wrap,.about .wrap{grid-template-columns:1fr}.mark{max-width:210px;order:-1}nav a{display:none}section{padding:52px 0}}
@media (prefers-reduced-motion:no-preference){.spin{transform-origin:150px 150px;animation:sp 40s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>

<p class="lead" data-ar="كل ما يحتاجه الطالب خلال مسيرته في المعهد، في مكان واحد." data-en="Everything a student needs during their time at the institute, in one place."></p>

<div class="svc"><h3 data-ar="الدورات وورش العمل" data-en="Courses and workshops"></h3><p data-ar="ورش تطبيقية في الميكانيك والكهرباء ومهارات سوق العمل." data-en="Hands-on workshops in mechanics, electricity, and job-market skills."></p></div>

document.documentElement.dir=cur==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-ar]").forEach(function(el){el.textContent=el.getAttribute("data-"+cur)});
document.getElementById("lang").textContent=cur==="ar"?"EN":"عربي";
document.title=cur==="ar"?"الهيئة الطلابية – معهد الهمك":"Student Council – Al-Hamak Institute";
}
document.getElementById("lang").addEventListener("click",function(){
cur=cur==="ar"?"en":"ar";
try{localStorage.setItem("lang",cur)}catch(e){}
apply();
});
apply();
})();
</script>
</body>
</html>
